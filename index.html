<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для моей Рисолат ❤️</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: "Georgia", serif;
    background: linear-gradient(#ffe6ee, #fff5f8);
    color: #5c2438;
    text-align: center;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    font-size: 35px;
    color: #d6336c;
    animation: fadeIn 2s;
}

.main-photo {
    width: 90%;
    max-width: 400px;
    border-radius: 25px;
    box-shadow: 0 0 20px rgba(214,51,108,0.3);
    margin: 20px 0;
}

.love-text {
    background: rgba(255,255,255,0.7);
    padding: 20px;
    border-radius: 20px;
    line-height: 1.8;
    font-size: 18px;
    text-align: left;
}

.gallery img {
    width: 45%;
    border-radius: 20px;
    margin: 5px;
}

audio {
    margin: 20px;
    width: 90%;
}

.heart {
    font-size: 30px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.2);
    }
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

</style>

</head>

<body>

<div class="container">

<h1>Для моей Рисолат ❤️</h1>

<div class="heart">❤️</div>

<img src="IMG_5076.jpeg" class="main-photo">

<audio controls>
<source src="Song.mp3" type="audio/mpeg">
</audio>

<div class="love-text">

<!-- ТВОЙ ТЕКСТ БУДЕТ ЗДЕСЬ -->

</div>

<div class="gallery">
<img src="IMG_5903.jpeg">
<img src="IMG_5915.jpeg">
</div>

</div>

</body>
</html>
